[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn"
version = "0.2.3"
description = "CLI for managing a Gluetun VPN container via docker compose"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click", "prompt-toolkit", "rich"]
keywords = ["gluetun", "vpn", "wireguard", "openvpn", "docker"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vpn = ["vpn.yml"]

[project.scripts]
vpn = "vpn:main"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# tests/ is a package (tests/__init__.py) so module names are tests.*
module = "tests.*"
# Tests stay body-checked but skip strictness ceremony:
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
no_implicit_reexport = false
warn_return_any = false
